<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c45"/>
      <stop offset="0.55" stop-color="#0d142e"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="220" fill="url(#bgGrad)"/>

  <!-- scattered stars for atmosphere -->
  <circle cx="60" cy="25" r="1.4" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="55" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="260" cy="20" r="1.2" fill="#ffffff" opacity="0.45"/>
  <circle cx="380" cy="40" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="500" cy="18" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="620" cy="45" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="720" cy="22" r="1.3" fill="#ffffff" opacity="0.4"/>
  <circle cx="40" cy="190" r="1.2" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="195" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- title -->
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#e6cc93" letter-spacing="2">MUHAMMAD AAZAN</text>
  <text x="400" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#D9B25B" letter-spacing="4">MERN STACK DEVELOPER</text>

  <!-- dots track -->
