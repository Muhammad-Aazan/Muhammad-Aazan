    <circle cx="60"  cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.114;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="100" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.159;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="140" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.205;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="180" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="220" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.295;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="260" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.341;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="300" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.386;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="340" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.432;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="380" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.477;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="420" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.523;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="460" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.568;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="500" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.614;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="540" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.659;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="580" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.705;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
    <circle cx="620" cy="150" r="4" fill="#D9B25B"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.75;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle>
