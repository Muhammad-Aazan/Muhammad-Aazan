  </g>

  <!-- pacman -->
  <g>
    <animateMotion path="M -40,150 L 840,150" dur="6s" repeatCount="indefinite"/>
    <circle r="18" fill="#F7DF1E">
      <animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="0.4s" repeatCount="indefinite" calcMode="discrete"/>
    </circle>
    <path d="M0,0 L18,-13 A18,18 0 1,1 18,13 Z" fill="#F7DF1E">
      <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="0.4s" repeatCount="indefinite" calcMode="discrete"/>
    </path>
